
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khan Technical Taleem GSM</title>
<style>
body{margin:0;background:#071426;color:#fff;font-family:Arial,sans-serif}
header{padding:22px;background:#10233d;text-align:center}
h1{color:#38bdf8;margin:5px}
main{max-width:900px;margin:25px auto;padding:15px}
input{width:100%;padding:15px;box-sizing:border-box;border-radius:9px;border:1px solid #345;background:#10233d;color:white;font-size:16px}
.card{background:#10233d;padding:16px;margin:12px 0;border-radius:10px;border:1px solid #23415f}
button{background:#087eaf;color:white;border:0;padding:10px 14px;border-radius:7px;margin:5px;cursor:pointer}
.small{color:#9fb4ca}
.good{color:#4ade80}.unknown{color:#fbbf24}
.hidden{display:none}
</style>
</head>
<body>
<header>
<h1>Khan Technical Taleem GSM</h1>
<p>Mobile Models & GSM Tool Database</p>
</header>

<main>
<input id="search" placeholder="Search brand, model or model number...">
<p id="count" class="small">Loading models...</p>
<section id="models"></section>
<section id="details" class="hidden"></section>
</main>

<script>
let devices = [];

async function loadDatabase(){
  try{
    const response = await fetch("./models.json");
    if(!response.ok) throw new Error("models.json not found");
    devices = await response.json();
    document.getElementById("count").textContent =
      devices.length + " models loaded";
    showModels(devices);
  }catch(error){
    document.getElementById("count").textContent =
      "Database file could not be loaded. Check models.json.";
  }
}

function showModels(list){
  document.getElementById("details").classList.add("hidden");
  const area = document.getElementById("models");
  area.innerHTML = "";

  list.forEach((device,index)=>{
    const card = document.createElement("div");
    card.className = "card";

    const title = document.createElement("h3");
    title.textContent = device.brand + " " + device.model;

    const number = document.createElement("p");
    number.className = "small";
    number.textContent = "Model: " + (device.model_number || "Not listed");

    const button = document.createElement("button");
    button.textContent = "View Details";
    button.onclick = ()=>showDetails(index);

    card.append(title,number,button);
    area.appendChild(card);
  });
}

function showDetails(index){
  const d = devices[index];
  const area = document.getElementById("details");
  document.getElementById("models").innerHTML = "";
  area.classList.remove("hidden");
  area.innerHTML = "";

  const title = document.createElement("h2");
  title.textContent = d.brand + " " + d.model;
  area.appendChild(title);

  addInfo(area,"Model Number",d.model_number);
  addInfo(area,"Chipset",d.chipset);
  addInfo(area,"Android Version",d.android_version);

  const heading = document.createElement("h3");
  heading.textContent = "GSM Tool Compatibility";
  area.appendChild(heading);

  const functions = [
    ["FRP","FRP"],
    ["Factory Reset","Factory Reset"],
    ["Flashing","Flashing"],
    ["Firmware","Firmware"]
  ];

  functions.forEach(([label,key])=>{
    const section = document.createElement("div");
    section.className = "card";

    const h = document.createElement("h3");
    h.textContent = label;
    section.appendChild(h);

    const tools = (d.tools || []).filter(t=>t.function===key);

    if(!tools.length){
      const p = document.createElement("p");
      p.className = "unknown";
      p.textContent = "Not Verified";
      section.appendChild(p);
    }else{
      tools.forEach(tool=>{
        const p = document.createElement("p");
        p.textContent =
          tool.name + " — " + tool.status +
          (tool.version ? " | Version: "+tool.version : "") +
          (tool.note ? " | "+tool.note : "");
        p.className =
          tool.status === "Supported" ? "good" : "unknown";
        section.appendChild(p);
      });
    }
    area.appendChild(section);
  });

  const back = document.createElement("button");
  back.textContent = "Back to Models";
  back.onclick = ()=>showModels(devices);
  area.appendChild(back);
}

function addInfo(parent,label,value){
  const p = document.createElement("p");
  p.textContent = label + ": " + (value || "Not listed");
  parent.appendChild(p);
}

document.getElementById("search").addEventListener("input",e=>{
  const q = e.target.value.toLowerCase();
  showModels(devices.filter(d=>
    [d.brand,d.model,d.model_number].some(v=>
      (v || "").toLowerCase().includes(q)
    )
  ));
});

loadDatabase();
</script>
</body>
</html>
